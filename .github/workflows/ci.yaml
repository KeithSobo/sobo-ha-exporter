name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality-and-tests:
    name: Quality Checks & Test Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck yamllint markdownlint

      - name: Install Python & Node Dependencies
        run: |
          pip install -r sobo-ha-exporter/requirements.txt
          pip install pytest pytest-cov ruff mypy types-PyYAML types-requests
          npm ci

      - name: Prettier Format Check
        run: npm run format:check

      - name: Ruff Lint Check
        run: ruff check .

      - name: Ruff Format Check
        run: ruff format --check .

      - name: Mypy Type Check
        run: mypy sobo-ha-exporter/app

      - name: YAML Lint
        run: yamllint .

      - name: Markdown Lint
        run: markdownlint "**/*.md" || echo "Warnings found in markdown"

      - name: ShellCheck
        run: shellcheck sobo-ha-exporter/*.sh

      - name: Run Unit Tests & Verify Coverage Threshold (>= 30%)
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=30

      - name: Run Integration Tests
        run: pytest tests/integration

  docker-build:
    name: Build Add-on Docker Container
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Local Image
        uses: docker/build-push-action@v5
        with:
          context: ./sobo-ha-exporter
          file: ./sobo-ha-exporter/Dockerfile
          push: false
          tags: sobo-ha-exporter:test
